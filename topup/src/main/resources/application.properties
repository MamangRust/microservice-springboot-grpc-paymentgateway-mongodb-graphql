spring.application.name=topup-service
spring.data.mongodb.uri=mongodb://${TOPUP_DB_HOST:localhost}:${TOPUP_DB_PORT:27017}/${TOPUP_DB_NAME:pg_financial}
spring.data.mongodb.auto-index-creation=true

# gRPC server
grpc.server.port=9008

# gRPC clients (downstream services)
grpc.client.card.host=${CARD_GRPC_HOST:localhost}
grpc.client.card.port=${CARD_GRPC_PORT:9004}
grpc.client.saldo.host=${SALDO_GRPC_HOST:localhost}
grpc.client.saldo.port=${SALDO_GRPC_PORT:9007}

