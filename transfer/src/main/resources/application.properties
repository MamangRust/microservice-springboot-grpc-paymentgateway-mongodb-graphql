spring.application.name=transfer-service
spring.data.mongodb.uri=mongodb://${TRANSFER_DB_HOST:localhost}:${TRANSFER_DB_PORT:27017}/${TRANSFER_DB_NAME:pg_financial}
spring.data.mongodb.auto-index-creation=true

# gRPC server
grpc.server.port=9010

# gRPC client -> card service
grpc.client.card.host=${CARD_SERVICE_HOST:localhost}
grpc.client.card.port=${CARD_SERVICE_PORT:9004}

# gRPC client -> saldo service
grpc.client.saldo.host=${SALDO_SERVICE_HOST:localhost}
grpc.client.saldo.port=${SALDO_SERVICE_PORT:9007}

# gRPC client -> ai-security service
grpc.client.ai-security.host=${AI_SECURITY_HOST:localhost}
grpc.client.ai-security.port=${AI_SECURITY_PORT:50051}

# JWT
springjwt.app.jwtSecret=0a5371c29751174b5601acb50153c0e66e4f6d6525ed08485e63d94a70985c31
springjwt.app.jwtRefreshSecret=0a5371c29751174b5601acb50153c0e66e4f6d6525ed08485e63d94a70985c32
springjwt.app.jwtExpirationMs=86400000
springjwt.app.jwtRefreshExpirationMs=86400000
